<!doctype html>
<html lang="zh-Hans" data-dsh-calling-card-skin>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero fixture (zh-Hans)</title>
<link rel="stylesheet" href="../lib/skin.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { min-height: 100vh; }
  #frame { height: calc(100vh - 32px); display: grid; grid-template-columns: 280px minmax(0, 1fr); position: relative; }
  @media (max-width: 900px) {
    #frame { height: auto; min-height: calc(100vh - 32px); grid-template-columns: 1fr; }
    #sidebar { min-height: 0; }
    #center { min-height: 70vh; }
  }
  #sidebar, #center { min-width: 0; min-height: 0; }
  #center { display: flex; flex-direction: column; }
  #center > [data-phase] { display: flex; flex-direction: column; min-height: 0; }
  /* The host's shell overlay sits above the columns and is click-through. */
  #frame > [data-shell-overlay] { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  [data-conversation-header-leading] { padding: 16px 20px 8px; color: #f7f4ee; }
  [data-conversation-scroll] { flex: 1; overflow: auto; padding: 12px 28px 24px; }
  [data-composer-seat] { padding: 8px 20px 16px; }
  [data-composer-card] { position: relative; padding: 12px 14px; }
  [data-composer-input] { width: 100%; min-height: 52px; border: 0; background: transparent; resize: none; }
  .fixture-banner { margin: 0; background: #fff; color: #111; font: 700 12px/1.4 sans-serif; padding: 6px 10px; }
  .fixture-nav { border: 0; text-align: left; }
  #sidebar { display: flex; flex-direction: column; overflow: hidden; }
  button.send { background: #e60012; color: #fff; border: 0; font-weight: 800; padding: 8px 12px; }
</style>
</head>
<body>
<p class="fixture-banner" data-fixture-status>测试夹具 · 空白落地页 · 不是已连接的 DeepSeek Harness</p>
<div id="frame">
  <div id="sidebar">
    <button type="button" class="fixture-brand" style="background:none;border:0;padding:8px 12px;height:40px"><span class="dsh-cc-name dsh-cc-void" aria-hidden="true"></span></button>
    <button type="button" data-sidebar-toggle aria-label="夹具侧栏折叠" hidden></button>
    <button type="button" class="fixture-nav" aria-current="page">New Session</button>
    <button type="button" class="fixture-nav" data-fixture-panel>Plugins</button>
    <button type="button" class="fixture-nav">Automation tasks</button>
    <div role="treeitem" data-row-key="workspace:demo">夹具项目</div>
    <div role="treeitem" data-row-key="session:demo-1" aria-selected="false">检查令牌刷新</div>
    <div role="treeitem" data-row-key="session:demo-2" aria-selected="false">整理交付说明</div>
    <div role="treeitem" data-row-key="session:demo-3" aria-selected="false">阅读边界用例</div>
  </div>
  <div id="center">
    <div data-phase="hero" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 32px;min-height:0">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span class="hitbox"><div><svg class="dsh-cc-hero" width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,2 19.8,11.6 30,12.6 22.2,19.4 24.4,29.4 16,24.2 7.6,29.4 9.8,19.4 2,12.6 12.2,11.6" fill="none" stroke="#111" stroke-width="1.7"/><polygon points="16,8 18.4,14.2 25,14.8 20,19.2 21.4,25.6 16,22.2 10.6,25.6 12,19.2 7,14.8 13.6,14.2" fill="none" stroke="#e60012" stroke-width="1.4"/></svg></div></span>
        <span class="title"><span>探索未至之境</span><span>预览版</span></span>
      </div>
      <form data-composer-seat data-conversation-region="composer" style="margin-top:28px">
        <div data-composer-card>
          <textarea data-composer-input placeholder="下一步，要让 DSH 做什么？"></textarea>
          <button class="send" type="button">SEND</button>
        </div>
      </form>
    </div>
  </div>
  <div data-shell-overlay></div>
</div>
<script src="fixture.js"></script>
</body>
</html>
