<script>
  const model = document.getElementById('m-model')
  model.classList.add('_9r0rkG_menu')
  model.setAttribute('role', 'group')
  const groups = document.createElement('div')
  groups.className = '_9r0rkG_groups'
  groups.setAttribute('role', 'menu')
  for (const child of [...model.children]) {
    if (!child.className.includes('_material_')) groups.append(child)
  }
  model.append(groups)
  for (const option of model.querySelectorAll('button')) option.setAttribute('role', 'menuitemradio')
  for (const check of model.querySelectorAll('svg[class*="_check_"]')) {
    const wrap = document.createElement('span')
    wrap.className = '_9r0rkG_check'
    check.replaceWith(wrap)
    wrap.append(check)
  }
  const trigger = document.querySelector('#m-ctx [aria-haspopup="menu"]')
  const wrapper = trigger.parentElement
  const submenu = document.createElement('div')
  submenu.id = 'fixture-submenu'
  submenu.className = '_surface_1w4el_1 _list_1p5el_7 _submenu_1p5el_8'
  submenu.setAttribute('role', 'menu')
  submenu.setAttribute('data-menu-material', 'translucent')
  submenu.style.display = 'none'
  for (const label of ['保留全部消息', '仅保留当前分支']) {
    const button = document.createElement('button')
    button.type = 'button'
    button.className = '_item_1p5el_105'
    button.setAttribute('role', 'menuitem')
    button.textContent = label
    submenu.append(button)
  }
  wrapper.append(submenu)
  const show = open => {
    trigger.setAttribute('aria-expanded', String(open))
    submenu.style.display = open ? 'flex' : 'none'
  }
  wrapper.addEventListener('pointerenter', () => show(true))
  wrapper.addEventListener('pointerleave', () => show(false))
  trigger.addEventListener('click', () => show(trigger.getAttribute('aria-expanded') !== 'true'))

    if (event.key === 'ArrowRight') { event.preventDefault(); show(true); submenu.firstElementChild.focus() }
    if (event.key === 'Escape' || event.key === 'ArrowLeft') { event.preventDefault(); show(false); trigger.focus() }
  })
