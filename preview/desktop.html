<!doctype html>
<html lang="zh-Hans" data-dsh-calling-card-skin data-windows-titlebar style="--dsh-windows-titlebar-height: 40px">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness · desktop fixture</title>
<link rel="stylesheet" href="../lib/skin.css">
<!--
  Fixture for the Windows desktop shell. Not the Harness client and not the
  desktop app. It imitates what the desktop preload and host layout put on the
  page: a 40px web-rendered caption (menubar host + window-control host, both
  open shadow roots), `window.dshDesktop.windowControls` (a stub that only logs),
  frame padding with a drag strip, and a sidebar whose collapsed state hides
  its lists the way the host does. Class names are made-up stand-ins for the
  host's CSS-module names. ?collapsed=1 starts collapsed; ?api=0 drops the stub.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #frame { height: 100vh; display: grid; position: relative; box-sizing: border-box; grid-template-columns: 280px minmax(400px, 1fr) minmax(0px, 0px); }
  html[data-windows-titlebar] #frame { padding-top: var(--dsh-windows-titlebar-height); background: #1b1b1c; }
  html[data-windows-titlebar] #frame::before { content: ""; height: var(--dsh-windows-titlebar-height); background: #1b1b1c; -webkit-app-region: drag; position: absolute; inset: 0 0 auto; }
  #frame[data-animating] { transition: grid-template-columns 250ms ease; }
  .xx_sidebarCol, #center { min-width: 0; min-height: 0; }
  .xx_sidebarCol { position: relative; overflow: hidden; }
  #center { display: flex; flex-direction: column; }
  #center > [data-phase] { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #frame > [data-shell-overlay] { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  [data-conversation-header-leading] { padding: 16px 20px 8px; color: #f7f4ee; }
  [data-conversation-scroll] { flex: 1; overflow: auto; padding: 12px 28px 24px; }
  [data-composer-seat] { padding: 8px 20px 16px; }
  [data-composer-card] { position: relative; padding: 12px 14px; }
  [data-composer-input] { width: 100%; min-height: 52px; border: 0; background: transparent; resize: none; }
  button.send { background: #e60012; color: #fff; border: 0; font-weight: 800; padding: 8px 12px; }
  /* host-like sidebar */
  .wtg9ga_root { display: flex; flex-direction: column; height: 100%; padding: 8px; box-sizing: border-box; color: #ddd; }
  .wtg9ga_logoRow { display: flex; align-items: center; justify-content: space-between; height: 40px; }
  .wtg9ga_iconButton { width: 28px; height: 28px; display: grid; place-items: center; background: transparent; border: 0; color: #ddd; padding: 0; }
  .wtg9ga_iconButton svg, .wtg9ga_panelGlyph svg, .wtg9ga_newSession svg { width: 16px; height: 16px; }
  .wtg9ga_newSession, .wtg9ga_panelRow { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #ddd; padding: 6px 8px; text-align: left; }
  .wtg9ga_panelList { display: flex; flex-direction: column; }
  .wtg9ga_regionArea { flex: 1; min-height: 0; overflow: auto; }
  .GAkraW_sectionHeader { display: flex; align-items: center; justify-content: flex-end; gap: 4px; height: 36px; padding-left: 8px; color: #999; }
  .GAkraW_sectionLabel { flex: 1; font-size: 13px; }
  .GAkraW_searchButton { width: 24px; height: 24px; display: grid; place-items: center; background: transparent; border: 0; color: #aaa; padding: 0; }
  .GAkraW_listArea { position: relative; }
  .GAkraW_listArea [role="treeitem"] { padding: 4px 8px; }
  /* host-like project row (Rows module): flex row of folder, chevron, title and actions */
  .wnFoaW_projectRow { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px !important; box-sizing: border-box; color: #ccc; cursor: pointer; }
  .wnFoaW_slot { display: inline-flex; width: 16px; height: 16px; flex: none; }
  .wnFoaW_slot svg { width: 16px; height: 16px; }
  .wnFoaW_projectRow .wnFoaW_chevron { display: none; }
  .wnFoaW_projectRow:hover .wnFoaW_chevron { display: inline-flex; }
  .wnFoaW_projectText { flex: 1; min-width: 0; overflow: hidden; } .wnFoaW_title { white-space: nowrap; text-overflow: ellipsis; overflow: hidden; font-size: 13px; }
  .wnFoaW_rowActions { display: inline-flex; gap: 2px; height: 20px; }
  .wnFoaW_iconButton { width: 20px; height: 20px; display: grid; place-items: center; border: 0; background: transparent; color: #999; padding: 0; }
  .wnFoaW_iconButton svg { width: 14px; height: 14px; }
  /* host bottom fade over the list (WorkspaceBrowser .fade) */
  .GAkraW_fade { left: 0; right: 0; background: linear-gradient(to bottom, transparent, #1b1b1c); pointer-events: none; height: 24px; position: absolute; bottom: 0; }
  .wtg9ga_footArea { margin-top: auto; display: flex; flex-direction: column; }
  .wtg9ga_footerActions { display: flex; }
  .wtg9ga_settingsArea { display: flex; }
  ._5Qcc8a_root { flex: 1; min-width: 0; } ._5Qcc8a_anchor { width: 100%; }
  ._5Qcc8a_trigger { width: 100%; height: 32px; padding: 6px 8px; border: 0; border-radius: 8px; color: #ddd; background: transparent; display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; cursor: pointer; }
  ._5Qcc8a_trigger svg { width: 14px; height: 14px; }
  .wtg9ga_brand { display: inline-flex; align-items: center; flex: 1; background: none; border: 0; padding: 0 0 0 8px; color: inherit; }
  .wtg9ga_brandIdentity { display: inline-flex; align-items: center; gap: 5px; height: 24px; }
  html[data-windows-titlebar] .wtg9ga_toggle { position: fixed; top: 6px; left: 12px; z-index: 30; }
  html[data-windows-titlebar] .wtg9ga_collapsed { padding: 0; }
  html[data-windows-titlebar] .wtg9ga_collapsed .wtg9ga_logoRow { height: 0; }
  html[data-windows-titlebar] .wtg9ga_collapsed .wtg9ga_newSession { position: fixed; top: 6px; left: 48px; z-index: 30; width: 28px; height: 28px; padding: 0; justify-content: center; }
  html[data-windows-titlebar] .wtg9ga_collapsed :is(.wtg9ga_panelList, .wtg9ga_regionArea, .wtg9ga_footArea) { display: none; }
  .wtg9ga_collapsed .xx_wide, .wtg9ga_collapsed .GAkraW_listArea, .wtg9ga_root:not(.wtg9ga_collapsed) .GAkraW_rail { display: none; }
  .GAkraW_rail { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #fixture-log { position: fixed; left: 50%; bottom: 4px; z-index: 50; margin: 0; background: #fff; color: #111; font: 700 11px/1.4 sans-serif; padding: 3px 8px; pointer-events: none; }
  #fixture-menu { position: fixed; z-index: 60; display: none; background: #2b2b2b; color: #eee; font: 13px/1.8 sans-serif; padding: 6px 14px; box-shadow: 0 6px 18px #000a; }
</style>
<script>
  /* Preload stand-ins, created before the plugin loads (like the real preload). */
  (() => {
    const params = new URLSearchParams(location.search)
    const log = (text) => {
      window.__ccLog = (window.__ccLog || []).concat(text)
      const out = document.getElementById('fixture-log')
      if (out) out.textContent = `夹具窗口桩：${text}`
    }
    let maximized = params.get('max') === '1'
    if (params.get('api') !== '0') {
      window.dshDesktop = {
        protocolVersion: 1,
        windowControls: {
          invoke: async (action) => {
            log(action)
            if (action === 'maximize') maximized = true
            if (action === 'restore') maximized = false
            return { maximized, minimized: false }
          },
          menu: async (name, x, y) => {
            log(`menu ${name} @ ${Math.round(x)},${Math.round(y)}`)
            const menu = document.getElementById('fixture-menu')
            menu.textContent = name === 'edit' ? '撤销 · 重做 · 剪切 · 复制 · 粘贴' : '关于 · 设置 · 退出'
            menu.style.left = `${x}px`
            menu.style.top = `${y}px`
            menu.style.display = 'block'
            await new Promise((resolve) => setTimeout(resolve, 900))
            menu.style.display = 'none'
            return true
          },
        },
      }
    }
    const shadowHost = (attr, css, labels) => {
      const host = document.createElement('div')
      host.setAttribute(attr, '')
      const root = host.attachShadow({ mode: 'open' })
      root.innerHTML = `<style>${css} button{height:40px;border:0;background:transparent;color:#ccc;font:13px sans-serif;padding:0 10px}</style>` + labels.map((label) => `<button type="button">${label}</button>`).join('')
      document.documentElement.append(host)
    }
    document.addEventListener('DOMContentLoaded', () => {
      shadowHost('data-windows-menu', ':host{position:fixed;top:0;left:var(--dsh-windows-menu-start,48px);height:40px;z-index:1100;display:flex}', ['应用', '编辑'])
      shadowHost('data-industrial-caption-fallback', ':host{position:fixed;top:0;right:0;height:40px;z-index:1101;display:flex} button{width:46px}', ['—', '☐', '✕'])
    })
  })()
</script>
</head>

<script>
  /* Host-like collapse: attribute + inline grid + collapsed class; lists stop rendering. */
  (() => {
    const frame = document.getElementById('frame')
    const root = document.getElementById('sideRoot')
    const toggle = document.querySelector('[data-sidebar-toggle]')
    const set = (collapsed, animate) => {
      if (animate) {
        frame.setAttribute('data-animating', '')
        setTimeout(() => frame.removeAttribute('data-animating'), 260)
      }
      frame.toggleAttribute('data-sidebar-collapsed', collapsed)
      document.getElementById('acct')?.setAttribute('data-collapsed', String(collapsed))
      root.classList.toggle('wtg9ga_collapsed', collapsed)
      frame.style.gridTemplateColumns = `${collapsed ? 0 : 280}px minmax(400px, 1fr) minmax(0px, 0px)`
      toggle.setAttribute('aria-label', collapsed ? '打开侧边栏' : '收起侧边栏')
      document.documentElement.style.setProperty('--dsh-windows-menu-start', collapsed ? '84px' : '48px')
      const list = document.querySelector('.GAkraW_listArea')
      if (collapsed) { window.__ccRows = list.innerHTML; list.innerHTML = '' } else if (window.__ccRows) list.innerHTML = window.__ccRows
    }
    toggle.addEventListener('click', () => set(!frame.hasAttribute('data-sidebar-collapsed'), true))
    document.querySelector('.GAkraW_listArea').addEventListener('click', (event) => {
      const row = event.target.closest('[data-row-key^="session:"]')
      if (!row) return
      for (const other of document.querySelectorAll('[data-row-key^="session:"]')) other.setAttribute('aria-selected', String(other === row))
      const out = document.getElementById('fixture-log')
      out.textContent = `夹具：打开 ${row.textContent}`
      window.__ccLog = (window.__ccLog || []).concat(`open ${row.getAttribute('data-row-key')}`)
    })
    /* Account menu stand-in: opens above the trigger like the host's (side: top), toggles aria-expanded. */
    const acct = document.getElementById('acct')
    const acctMenu = document.createElement('div')
    acctMenu.setAttribute('role', 'menu')
    acctMenu.id = 'fixture-acct-menu'
    acctMenu.style.cssText = 'position:fixed;z-index:60;display:none;background:#2b2b2b;color:#eee;font:13px/2 sans-serif;padding:4px 14px;min-width:124px'
    acctMenu.innerHTML = '<div role="menuitem">设置</div><div role="menuitem">联系我们</div>'
    document.body.appendChild(acctMenu)
    acct.addEventListener('click', () => {
      const open = acct.getAttribute('aria-expanded') !== 'true'
      acct.setAttribute('aria-expanded', String(open))
      const rect = acct.getBoundingClientRect()
      acctMenu.style.left = `${rect.left}px`
      acctMenu.style.bottom = `${innerHeight - rect.top + 6}px`
      acctMenu.style.display = open ? 'block' : 'none'
      window.__ccLog = (window.__ccLog || []).concat(`account ${open ? 'open' : 'close'}`)
    })
    window.__ccSetCollapsed = set
    if (new URLSearchParams(location.search).get('collapsed') === '1') {
      /* The skin remembers rows while expanded, like a real session that started open. */
      window.__ccCollapseAfterBoot = true
    }
  })()
</script>
<script src="fixture.js"></script>
<script>
  if (window.__ccCollapseAfterBoot) {
    const wait = () => document.querySelector('.dsh-cc-chrome') ? setTimeout(() => window.__ccSetCollapsed(true, false), 50) : setTimeout(wait, 20)
    wait()
  }
</script>
